[project]
name = "policy-rag-lab"
version = "0.1.0"
description = "Team scaffold for a policy-document RAG lab"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "markdown-it-py>=3.0,<4.0",
  "pymupdf>=1.25,<2.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "tenacity>=9.0,<10.0",
  "pymupdf4llm>=1.28.2",
  "uvicorn>=0.34,<1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.9,<1.0",
  "mypy>=1.14,<2.0",
]
rag = [
  "chromadb>=1.0,<2.0",
  "sentence-transformers>=3.0,<4.0",
  "snowballstemmer>=2.2,<3.0",
  "torch>=1.11",
  "rank-bm25>=0.2,<0.3",
]

[tool.uv]
package = false

# Use CPU wheels on Linux/Windows; macOS wheels on PyPI are already CUDA-free.
[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["rag"]
