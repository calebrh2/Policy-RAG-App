name: CI

on:
  push:
  pull_request:

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev --group rag
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest tests/unit tests/integration tests/evaluation
